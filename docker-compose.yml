services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tripzy-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: tripzy-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped